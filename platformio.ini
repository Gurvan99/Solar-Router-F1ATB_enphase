; PlatformIO project pour Solar Router F1ATB (compilation en ligne de commande / VS Code)
; Complète l'Arduino IDE, ne le remplace pas : les fichiers .ino restent à la racine du dépôt,
; PlatformIO les compile directement (src_dir = .) comme le fait l'IDE Arduino.
;
; Utilisation :
;   pio run            -> compile le firmware
;   pio run -t upload  -> compile et flashe l'ESP32
;   pio device monitor  -> moniteur série
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Le projet est un sketch Arduino classique (.ino à la racine), pas une arborescence src/ PlatformIO
src_dir = .

[env:esp32dev]
; L'espressif32 officiel PlatformIO est bloqué sur arduino-esp32 core 2.0.17 (trop ancien : pas de
; ledcAttachChannel, pas de Network.h requis par EthernetESP32). On utilise donc le fork
; communautaire pioarduino qui suit les cores arduino-esp32 récents (>=3.0.1 requis par ce projet).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev          ; adapter si besoin : ex. board = esp-wrover-kit pour un WT32-ETH01
framework = arduino
board_build.filesystem = littlefs

; Table de partitions personnalisée du projet (app0/app1/spiffs) - NE PAS utiliser un schéma standard
board_build.partitions = partitions.csv

; Exclut les dossiers annexes du dépôt (outils PC, doc, git) de la compilation firmware
build_src_filter =
    +<*>
    -<.git/>
    -<.github/>
    -<.pio/>
    -<.vscode/>
    -<PC_Tools/>
    -<Test/>

; Flag de compilation utilisé par le projet (voir build_opt.h, repris ici pour PlatformIO)
; -I. : expose le OneWire.h personnalisé du dépôt (racine) aux bibliothèques tierces
; (DallasTemperature en dépend), puisque lib_ignore = OneWire retire la copie officielle.
build_flags =
    -Wno-missing-field-initializers
    -I.

; Bibliothèques tierces utilisées par le projet (voir #include en tête de Solar_Router_V17_25.ino)
lib_deps =
    knolleary/PubSubClient
    milesburton/DallasTemperature
    bblanchon/ArduinoJson
    plageoj/UrlEncode
    networking-for-arduino/EthernetESP32
    lovyan03/LovyanGFX

; Le projet embarque sa propre copie modifiée de OneWire.cpp/.h à la racine (voir en-tête du
; fichier : "V2.3.8 depuis .zip github, pas bib arduino"). Sans cette exclusion, DallasTemperature
; installe automatiquement la lib OneWire officielle en double, provoquant des symboles dupliqués
; à l'édition de liens.
lib_ignore = OneWire

monitor_speed = 115200
